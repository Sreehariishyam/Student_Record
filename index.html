<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            background-color: #f1f5fb;
            color: #1f2937;
        }

        .main-container {
            max-width: 1000px;
            margin: 40px auto;
        }

        /* Header banner */
        .heading {
            text-align: center;
            padding: 36px 20px;
            margin-bottom: 28px;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, #0d6efd 0%, #4f46e5 100%);
            box-shadow: 0 8px 24px rgba(13, 110, 253, 0.25);
        }

        .heading h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .heading p {
            margin: 0;
            color: rgba(255, 255, 255, 0.85) !important;
        }

        /* Cards */
        .form-card, .table-card {
            background-color: #fff;
            padding: 28px;
            border-radius: 14px;
            margin-bottom: 26px;
            border: 0;
            box-shadow: 0 4px 16px rgba(31, 41, 55, 0.08);
        }

        .form-card h4, .table-card h4 {
            font-weight: 700;
            padding-left: 12px;
            border-left: 4px solid #0d6efd;
        }

        .form-label {
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        .form-control {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #d1d9e6;
            background-color: #f9fbff;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }

        .btn-primary {
            padding: 10px 28px;
            border-radius: 10px;
            font-weight: 600;
            border: 0;
            background: linear-gradient(135deg, #0d6efd, #4f46e5);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0b5ed7, #4338ca);
            transform: translateY(-1px);
        }

        /* Table */
        .table-responsive {
            border-radius: 10px;
            border: 1px solid #e3e9f3;
        }

        .table {
            margin-bottom: 0;
            --bs-table-hover-bg: #eef4ff;
        }

        .table th {
            background-color: #0d6efd;
            color: #fff;
            font-weight: 600;
            padding: 14px 12px;
            border-color: #0d6efd;
        }

        .table td {
            padding: 12px;
            border-color: #e3e9f3;
        }

        .table tbody tr:nth-child(even) > td {
            background-color: #f7faff;
        }

        /* Row buttons */
        .action-btn {
            padding: 5px 14px;
            margin: 2px;
            border-radius: 20px;
            font-weight: 600;
            border: 0;
        }

        .btn-warning.action-btn {
            background-color: #fff3cd;
            color: #8a6100;
        }
        .btn-warning.action-btn:hover {
            background-color: #ffc107;
            color: #000;
        }

        .btn-danger.action-btn {
            background-color: #fde2e2;
            color: #b42318;
        }
        .btn-danger.action-btn:hover {
            background-color: #dc3545;
            color: #fff;
        }

        /* Shown only while there are no records */
        .empty-note {
            display: none;
            text-align: center;
            color: #6b7280;
            padding: 22px 0 4px;
        }
        .table-card:has(#result:empty) .empty-note { display: block; }
    </style>
</head>

<body onload="displayStudent()">

    <div class="container main-container">

        <!-- Heading -->
        <div class="heading">
            <h1>Student Management System</h1>
            <p class="text-muted">Manage Student Details Easily</p>
        </div>

        <!-- Student Form -->
        <div class="form-card">
            <h4 class="mb-4">Add Student Details</h4>

            <div class="row g-3">

                <div class="col-md-4">
                    <label for="id" class="form-label">Student ID</label>
                    <input type="text" id="id" class="form-control"
                           placeholder="Enter student ID">
                </div>

                <div class="col-md-4">
                    <label for="name" class="form-label">Student Name</label>
                    <input type="text" id="name" class="form-control"
                           placeholder="Enter student name">
                </div>

                <div class="col-md-4">
                    <label for="course" class="form-label">Course</label>
                    <input type="text" id="course" class="form-control"
                           placeholder="Enter student course">
                </div>

                <div class="col-12">
                    <button class="btn btn-primary px-4"
                            onclick="addStudent()">
                        Add Student
                    </button>
                </div>

            </div>
        </div>

        <!-- Student Table -->
        <div class="table-card">
            <h4 class="mb-3">Student Records</h4>

            <div class="table-responsive">
                <table class="table table-hover text-center align-middle">
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="result"></tbody>
                </table>
            </div>

            <p class="empty-note">No students yet. Add one using the form above.</p>
        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
